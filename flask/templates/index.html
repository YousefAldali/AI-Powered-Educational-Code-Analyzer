<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Review</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Code Review</h1>
    <p class="subtitle">
      Paste your Python or Java code below and click <strong>Review</strong>.
    </p>
<form method="POST" enctype="multipart/form-data">

    <div class="editor-wrapper">
        <div id="editor"></div>
    </div>

    <textarea id="code" name="code" style="display:none;">{{ code or '' }}</textarea>

    <button type="submit">Review</button>
    <input type="file" name="file" accept=".py">
</form>

    {% if review %}
      <div class="result">
        <h2>Feedback</h2>
        <ul>
          {% for issue in review.issues %}
            <li>{{ issue }}</li>
          {% endfor %}
        </ul>

        <h2>Summary</h2>
        <p>{{ review.summary }}</p>
      </div>
    {% endif %}
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>


<script>
require.config({
    paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }
});

require(['vs/editor/editor.main'], function () {

    monaco.editor.defineTheme('yousefTheme', {
        base: 'vs-dark',
        inherit: true,
        rules: [
            { token: '', foreground: 'e5e7eb', background: '020617' }, 
            { token: 'comment', foreground: '6b7280' },
            { token: 'keyword', foreground: '38bdf8' },   
            { token: 'string', foreground: 'a3e635' },     
            { token: 'number', foreground: 'f97316' },     
        ],
        colors: {
            'editor.background': '#020617',
            'editorGutter.background': '#020617',

            'editorLineNumber.foreground': '#38bdf8',
            'editorLineNumber.activeForeground': '#0ea5e9',

            'editorCursor.foreground': '#38bdf8',

            'editor.foreground': '#e5e7eb',

            'editor.lineHighlightBackground': '#1e293b55',

            'editor.selectionBackground': '#1e3a8a44',

            'scrollbarSlider.background': '#47556955',
            'scrollbarSlider.activeBackground': '#475569aa',
            'scrollbarSlider.hoverBackground': '#47556988',
        }
    });

    window.editor = monaco.editor.create(document.getElementById('editor'), {
        value: document.getElementById('code').value,
        language: 'python',
        theme: 'yousefTheme',
        fontSize: 14,
        fontFamily: "Consolas, 'Fira Code', monospace",
        automaticLayout: true,
        wordWrap: "on",
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        tabSize: 4,
        insertSpaces: true
    });

    document.querySelector("form").addEventListener("submit", function () {
        document.getElementById("code").value = editor.getValue();
    });
});
</script>


</body>
</html>
