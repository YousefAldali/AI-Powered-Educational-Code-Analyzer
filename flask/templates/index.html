<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Review</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>Code Review</h1>
    <p class="subtitle">
      Paste your Python or Java code below and click <strong>Review</strong>.
    </p>
<form method="POST" enctype="multipart/form-data">
   <div id="editor">
  <div id="lineNumbers"></div>
  <textarea id="code" name="code" rows="14" placeholder="Paste your code here...">{{ code or '' }}</textarea>
  </div>

<button type="submit">Review</button>
<input type="file" name="file" accept=".py">
</form>
    {% if review %}
      <div class="result">
        <h2>Feedback</h2>
        <ul>
          {% for issue in review.issues %}
            <li>{{ issue }}</li>
          {% endfor %}
        </ul>

        <h2>Summary</h2>
        <p>{{ review.summary }}</p>
      </div>
    {% endif %}
  </div>
  <script>
function updateLines() {
    const textarea = document.getElementById("code");
    const lines = textarea.value.split("\n").length;

    let lineNumbers = "";
    for (let i = 1; i <= lines; i++) {
        lineNumbers += i + "<br>";
    }
    document.getElementById("lineNumbers").innerHTML = lineNumbers;
}

function syncScroll() {
    document.getElementById("lineNumbers").scrollTop =
        document.getElementById("code").scrollTop;
}

document.getElementById("code").addEventListener("input", updateLines);
document.getElementById("code").addEventListener("scroll", syncScroll);

updateLines();
</script>

</body>
</html>
